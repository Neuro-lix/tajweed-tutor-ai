name: Android build (APK + AAB)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version affichée (ex. 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

env:
  VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'zymyzuydidefjmiympsl' }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://zymyzuydidefjmiympsl.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp5bXl6dXlkaWRlZmptaXltcHNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0Mzc3NjUsImV4cCI6MjA4MzAxMzc2NX0.E7XaTYFp5PiIzsQU853OMD-XivwCY_3xp9R87jkYQl0' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Microphone permission + version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' $M
          grep -q RECORD_AUDIO $M
          V=android/variables.gradle
          sed -i "s/minSdkVersion = [0-9]*/minSdkVersion = 24/; s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/" $V
          grep -E "SdkVersion" $V
          grep -q 'applicationId "com.tajweedtutorai.app"' android/app/build.gradle
          VNAME="${{ github.event.inputs.version_name || github.ref_name }}"; VNAME="${VNAME#v}"
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VNAME\"/" $G

      - name: Signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              release {
                storeFile file("release.keystore")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE

      - name: Build signed APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tajweed-tutor-ai-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
