name: Security Scan
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: NPM Audit (high/critical only)
        # Note: les vulnérabilités "high" restantes proviennent uniquement de
        # dépendances transitives tierces (workbox-build / rollup-plugin-terser / ws
        # tirées par vite-plugin-pwa). vite-plugin-pwa a été mis à jour en 1.x, ce qui
        # corrige la majorité d'entre elles ; s'il en reste, aucun correctif amont
        # n'est disponible pour l'instant et elles n'affectent que la chaîne de build,
        # pas le code exécuté par les utilisateurs.
        run: npm audit --audit-level=high
      - name: Lint (fail on warnings)
        run: npx eslint . --max-warnings=0
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build check
        run: npm run build
      - name: Check bundle size
        run: |
          MAX=700
          for f in dist/assets/*.js; do
            size=$(du -k "$f" | cut -f1)
            if [ "$size" -gt "$MAX" ]; then
              echo "❌ Bundle too large: $f ($size KB > $MAX KB)"
              exit 1
            fi
          done
          echo "✅ All bundles within size limit"