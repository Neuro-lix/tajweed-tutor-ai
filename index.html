    <script>
      // Nettoie les anciens Service Workers après un déploiement,
      // SANS recharger la page lors de la première visite (bug corrigé).
      (function () {
        try {
          var SW_VERSION = '2026-10-07-a';
          var VERSION_KEY = 'app_sw_version';
          var prevVersion = localStorage.getItem(VERSION_KEY);
          localStorage.setItem(VERSION_KEY, SW_VERSION);

          // Première visite : rien à nettoyer
          if (prevVersion === null || prevVersion === SW_VERSION) return;
          if (!('serviceWorker' in navigator)) return;

          navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (!regs.length) return; // aucun ancien SW → pas de rechargement
            Promise.all(regs.map(function (r) { return r.unregister(); }))
              .then(function () {
                if (window.caches && caches.keys) {
                  return caches.keys().then(function (names) {
                    return Promise.all(names.map(function (n) { return caches.delete(n); }));
                  });
                }
              })
              .then(function () {
                if (!sessionStorage.getItem('sw_reloaded')) {
                  sessionStorage.setItem('sw_reloaded', '1');
                  window.location.reload();
                }
              })
              .catch(function () {});
          }).catch(function () {});
        } catch (e) { /* ignore */ }
      })();
    </script>
